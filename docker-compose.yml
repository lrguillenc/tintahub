services:

  postgres:
    image: postgres:16
    container_name: tintahub_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./base_datos/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tintahub_network

  backend:
    build: ./backend
    container_name: tintahub_backend
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      - postgres
    networks:
      - tintahub_network

  nginx:
    image: nginx:latest
    container_name: tintahub_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - tintahub_network

volumes:
  postgres_data:

networks:
  tintahub_network:
    driver: bridge